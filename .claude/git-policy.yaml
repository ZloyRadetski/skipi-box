git_policy:
  allow_ai_attribution: false
  strip_co_authors: true
  forbidden_patterns:
    - "Co-authored-by:.*[Cc]laude.*"
    - "Co-authored-by:.*anthropic.*"
    - ".*Generated by.*"
    - ".*Assisted by.*"
  commit_author: "Strictly from local git config"
  message_style: "Conventional, concise, without AI footprints"