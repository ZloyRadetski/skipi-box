name: Build Release APKs

# Runs only on request: by hand from the Actions tab, or when a v* tag is pushed (build only).
# A push to a branch never builds anything.
#
# What a manual run publishes is chosen with "publish":
#   none        build the APKs and keep them as workflow artifacts only
#   prerelease  also create a GitHub pre-release; the app update check ignores pre-releases
#               (it reads /releases/latest), so no user is notified
#   release     also create a full release marked latest; EVERY user is notified.
#               Allowed only from main and only for a strict x.y.z version.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "What to publish: none (artifacts only), prerelease (not offered to users) or release (offered to ALL users)"
        required: true
        default: prerelease
        type: choice
        options:
          - none
          - prerelease
          - release
      version_name:
        description: "Version to build and tag, for example 1.0.1 (a pre-release may use 1.0.1-rc.1). Empty uses buildSrc BuildConfig.kt"
        required: false
        type: string
      send_to_telegram:
        description: "Upload release APKs to Telegram"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Publish, And Notify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      create_github_release: ${{ steps.version.outputs.create_github_release }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      TELEGRAM_MAX_DOCUMENT_BYTES: ${{ vars.TELEGRAM_MAX_DOCUMENT_BYTES }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      SEND_TO_TELEGRAM: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.send_to_telegram == 'true' }}
      REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}
      PUBLISH_MODE: ${{ github.event.inputs.publish || 'none' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read ProjectConfig version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          config_version="$(sed -n 's/^[[:space:]]*const val VERSION_NAME = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$config_version" ]; then
            echo "::error::Unable to read ProjectConfig.VERSION_NAME from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          version_name="${REQUESTED_VERSION_NAME:-$config_version}"
          mode="${PUBLISH_MODE:-none}"
          release_regex='^[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease_regex='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

          create_github_release=false
          is_prerelease=false
          case "$mode" in
            none)
              echo "::notice::publish=none: building artifacts only, nothing is published."
              ;;
            prerelease)
              if ! [[ "$version_name" =~ $prerelease_regex ]]; then
                echo "::error::A pre-release needs a version like 1.2.3 or 1.2.3-rc.1, got '$version_name'."
                exit 1
              fi
              create_github_release=true
              is_prerelease=true
              echo "::notice::publish=prerelease: a GitHub pre-release v$version_name will be created. Users are not notified."
              ;;
            release)
              if ! [[ "$version_name" =~ $release_regex ]]; then
                echo "::error::A full release needs a strict x.y.z version, got '$version_name'. Use publish=prerelease for anything else."
                exit 1
              fi
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::A full release notifies every user and can only be published from main, but this run is on $GITHUB_REF."
                exit 1
              fi
              create_github_release=true
              echo "::warning::publish=release: v$version_name becomes the latest release and EVERY user will be notified."
              ;;
            *)
              echo "::error::Unknown publish mode '$mode'."
              exit 1
              ;;
          esac

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version_name" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "create_github_release=$create_github_release" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The SDK packages are installed on every run on purpose: caching the whole platforms, build-tools
      # and NDK directories meant packing several GB (the runner ships many versions) and made the
      # post-job cache step run for a long time.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            echo "::error::Failed to accept Android SDK licenses."
            exit "$licenses_status"
          fi

          target_sdk="$(sed -n 's/^[[:space:]]*const val TARGET_SDK = \([0-9]\+\).*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$target_sdk" ]; then
            echo "::error::Unable to read ProjectConfig.TARGET_SDK from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          available_packages="$(sdkmanager --list | awk '{ print $1 }')"
          platform_package="platforms;android-${target_sdk}"
          if ! grep -Fxq "$platform_package" <<< "$available_packages"; then
            if grep -Fxq "platforms;android-${target_sdk}.0" <<< "$available_packages"; then
              platform_package="platforms;android-${target_sdk}.0"
            else
              echo "::error::No Android SDK platform package is available for TARGET_SDK=$target_sdk."
              exit 1
            fi
          fi

          build_tools_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^build-tools;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          ndk_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^ndk;[0-9]/ { print $1 }' | sort -V | tail -n 1)"

          if [ -z "$build_tools_package" ]; then
            echo "::error::No Android build-tools package is available from sdkmanager."
            exit 1
          fi
          if [ -z "$ndk_package" ]; then
            echo "::error::No Android NDK package is available from sdkmanager."
            exit 1
          fi

          sdkmanager --install "$platform_package" "$build_tools_package" "$ndk_package"

      - name: Configure Android NDK environment
        shell: bash
        run: |
          set -euo pipefail
          ndk_dir="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -n "$ndk_dir" ] && [ -d "$ndk_dir" ]; then
            echo "Found Android NDK at $ndk_dir"
            echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$ndk_dir" >> "$GITHUB_ENV"
          fi

      - name: Cache HevTun native binaries
        uses: actions/cache@v4
        with:
          path: hevtun/build/generated/jniLibs
          key: hevtun-binaries-${{ hashFiles('buildSrc/src/main/kotlin/BuildConfig.kt', 'hevtun/**', 'buildSrc/src/main/kotlin/BuildHevTunTask.kt') }}

      - name: Build release APKs
        run: ./gradlew --build-cache :app:assembleRelease

      - name: Sign release APKs
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "Using repository release keystore from secrets."
            keystore_path="$RUNNER_TEMP/release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            key_password="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
            key_alias="$RELEASE_KEY_ALIAS"
            store_password="$RELEASE_KEYSTORE_PASSWORD"
          else
            echo "::notice::Repository release keystore secrets not found. Generating a fallback release keystore."
            keystore_path="$RUNNER_TEMP/fallback-release.keystore"
            key_password="androidfallback"
            store_password="androidfallback"
            key_alias="androidkey"
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -alias "$key_alias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -dname "CN=SKIPI, OU=App, O=SKIPI, L=City, S=State, C=US"
          fi

          export RELEASE_KEYSTORE_PASSWORD="$store_password"
          export RELEASE_KEY_PASSWORD="$key_password"

          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$zipalign" ]; then
            echo "::error::zipalign was not found in Android build-tools."
            exit 1
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in Android build-tools."
            exit 1
          fi

          mkdir -p signed-apks
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            base_name="$(basename "$apk" .apk)"
            aligned_apk="$RUNNER_TEMP/${base_name}-aligned.apk"
            signed_apk="signed-apks/${base_name}-signed.apk"

            "$zipalign" -p -f 4 "$apk" "$aligned_apk"
            "$apksigner" sign \
              --ks "$keystore_path" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
              --ks-key-alias "$key_alias" \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out "$signed_apk" \
              "$aligned_apk"
            "$apksigner" verify --verbose "$signed_apk"
          done

          if ! find signed-apks -type f -name "*.apk" | grep -q .; then
            echo "::error::No signed release APKs were produced."
            exit 1
          fi

      - name: Collect release APKs
        id: collect
        shell: bash
        env:
          CONFIG_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CREATE_GITHUB_RELEASE: ${{ steps.version.outputs.create_github_release }}
        run: |
          set -euo pipefail

          ref_version_name="${GITHUB_REF_NAME#v}"
          version_name="${REQUESTED_VERSION_NAME:-}"

          if [ -z "$version_name" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$ref_version_name" != "$GITHUB_REF_NAME" ]; then
            version_name="$ref_version_name"
          fi
          if [ -z "$version_name" ]; then
            version_name="$CONFIG_VERSION_NAME"
          fi

          version_code="$(git rev-list --count HEAD)"
          mkdir -p release-artifacts github-release-artifacts

          shopt -s nullglob
          for apk in signed-apks/*.apk; do
            file_name="$(basename "$apk")"
            abi="universal"
            case "$file_name" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
              *x86*) abi="x86" ;;
              *universal*) abi="universal" ;;
            esac

            cp "$apk" "release-artifacts/SKIPI_${version_name}-${version_code}-${abi}.apk"
            cp "$apk" "github-release-artifacts/SKIPI-${abi}.apk"
          done

          if ! find release-artifacts -type f -name "*.apk" | grep -q .; then
            echo "::error::No release APKs were found under signed-apks."
            exit 1
          fi
          if ! find github-release-artifacts -type f -name "*.apk" | grep -q .; then
            echo "::error::No GitHub Release APKs were found under signed-apks."
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          ls -lh release-artifacts
          ls -lh github-release-artifacts

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKIPI_${{ steps.collect.outputs.version_name }}-${{ steps.collect.outputs.version_code }}
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Create tag and release notes
        if: steps.version.outputs.create_github_release == 'true'
        id: release_info
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.collect.outputs.version_code }}
        run: |
          set -euo pipefail

          current_sha="$(git rev-parse HEAD)"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$tag_sha" != "$current_sha" ]; then
              echo "::error::Tag $TAG_NAME already exists at $tag_sha, but this workflow is running at $current_sha."
              exit 1
            fi
            echo "Tag $TAG_NAME already exists on the current commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME" "$current_sha"
            git push origin "refs/tags/$TAG_NAME"
          fi

          mapfile -t release_tags < <(
            git for-each-ref --format='%(refname:short)' refs/tags |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )

          previous_candidates="$(mktemp)"
          for candidate in "${release_tags[@]}"; do
            if [ "$candidate" = "$TAG_NAME" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$candidate" "$current_sha"; then
              count="$(git rev-list --count "${candidate}..${current_sha}")"
              printf '%s\t%s\n' "$count" "$candidate" >> "$previous_candidates"
            fi
          done

          previous_tag=""
          if [ -s "$previous_candidates" ]; then
            previous_tag="$(sort -n "$previous_candidates" | head -n 1 | cut -f2-)"
          fi

          range="$current_sha"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_sha}"
          fi

          tmp_changes="$(mktemp)"
          git log --reverse --no-merges --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" > "$tmp_changes"
          if [ ! -s "$tmp_changes" ]; then
            git log --reverse --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" > "$tmp_changes"
          fi

          {
            echo "## SKIPI $TAG_NAME"
            echo
            echo "- Version name: $VERSION_NAME"
            echo "- Version code: $VERSION_CODE"
            echo

            if [ -n "$previous_tag" ]; then
              echo "### Changes since $previous_tag"
              echo
              echo "[Compare $previous_tag...$TAG_NAME](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG_NAME})"
            else
              echo "### Changes"
            fi
            echo

            if [ -s "$tmp_changes" ]; then
              cat "$tmp_changes"
              echo
            else
              echo "- No commit changes found."
            fi

            echo
            echo "### APK artifacts"
            echo
            find github-release-artifacts -maxdepth 1 -type f -name "*.apk" -printf "- %f\n" | sort
          } > release-notes.md

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.create_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            kind_flags=(--prerelease --latest=false)
            title="SKIPI $TAG_NAME (pre-release)"
          else
            kind_flags=(--prerelease=false --latest)
            title="SKIPI $TAG_NAME"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            already_prerelease="$(gh release view "$TAG_NAME" --json isPrerelease --jq .isPrerelease)"
            if [ "$IS_PRERELEASE" = "true" ] && [ "$already_prerelease" = "false" ]; then
              echo "::error::$TAG_NAME is already a published release; refusing to turn it back into a pre-release."
              exit 1
            fi
            gh release upload "$TAG_NAME" github-release-artifacts/*.apk --clobber
            gh release edit "$TAG_NAME"               --title "$title"               --notes-file release-notes.md               "${kind_flags[@]}"
          else
            gh release create "$TAG_NAME" github-release-artifacts/*.apk               --title "$title"               --notes-file release-notes.md               "${kind_flags[@]}"
          fi

      - name: Upload release APKs to Telegram
        if: env.SEND_TO_TELEGRAM == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apks < <(find release-artifacts -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files were found in release-artifacts before Telegram upload."
            find release-artifacts -maxdepth 1 -type f -print || true
            exit 1
          fi

          ls -lh release-artifacts
          max_document_bytes="${TELEGRAM_MAX_DOCUMENT_BYTES:-52428800}"
          commit_id="$(git rev-parse HEAD)"
          commit_short_id="$(git rev-parse --short=12 HEAD)"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$commit_id"
          workflow_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_message="$(git log -1 --pretty=%B)"
          commit_message="${commit_message//$'\r'/}"
          if [ -z "${commit_message//[[:space:]]/}" ]; then
            commit_message="(empty commit message)"
          fi
          if [ "${#commit_message}" -gt 650 ]; then
            commit_message="${commit_message:0:650}"$'\n...'
          fi
          commit_message_html="$(printf '%s' "$commit_message" | python3 -c 'import html, sys; print(html.escape(sys.stdin.read(), quote=False), end="")')"

          for apk in "${apks[@]}"; do
            apk_path="$(realpath "$apk")"
            apk_name="$(basename "$apk")"
            if [ ! -r "$apk_path" ]; then
              echo "::error::APK is not readable: $apk_path"
              exit 1
            fi

            apk_size="$(stat -c '%s' "$apk_path")"
            if [ "$apk_size" -gt "$max_document_bytes" ]; then
              echo "::warning::Skipping Telegram upload for $apk_name because it is $apk_size bytes, above the $max_document_bytes byte limit."
              continue
            fi

            echo "Uploading $apk_name to Telegram"

            caption="$(printf 'SKIPI\n\n%s\n\n%s\n<a href="%s">Commit</a> | <a href="%s">Workflow run</a>' \
              "$commit_message_html" \
              "$commit_short_id" \
              "$commit_url" \
              "$workflow_run_url")"

            args=(
              --fail-with-body
              -sS
              -X POST
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
              --form-string "chat_id=${TELEGRAM_CHAT_ID}"
              --form "document=@${apk_path};filename=${apk_name}"
              --form-string "caption=${caption}"
              --form-string "parse_mode=HTML"
            )

            if [ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]; then
              args+=(--form-string "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
            fi

            curl "${args[@]}"
          done

  desktop-windows:
    name: Build Windows Desktop (portable)
    # Runs after the APK job so the GitHub Release (if any) already exists to attach the archive to.
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      CREATE_GITHUB_RELEASE: ${{ needs.release.outputs.create_github_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The desktop build normally compiles SKIPI Core from a sibling checkout. CI uses the published
      # library of the pinned version instead, and refuses it unless its checksum matches.
      - name: Download the released SKIPI Core library
        shell: bash
        run: |
          set -euo pipefail

          core_version="$(sed -n 's/^[[:space:]]*const val SKIPI_CORE_VERSION = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$core_version" ]; then
            echo "::error::Unable to read ProjectConfig.SKIPI_CORE_VERSION from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          base="https://github.com/ZloyRadetski/skipi-core/releases/download/${core_version}"
          mkdir -p core-lib
          curl -fsSL --retry 3 -o core-lib/skipicore.dll "$base/skipicore.dll"
          curl -fsSL --retry 3 -o core-lib/sha256sums-desktop.txt "$base/sha256sums-desktop.txt"

          expected="$(grep -E '[[:space:]]\*?skipicore\.dll$' core-lib/sha256sums-desktop.txt | cut -d' ' -f1)"
          actual="$(sha256sum core-lib/skipicore.dll | cut -d' ' -f1)"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::skipicore.dll of $core_version does not match its published checksum (expected '$expected', got '$actual')."
            exit 1
          fi
          echo "SKIPI Core $core_version: checksum $actual"
          echo "SKIPI_CORE_DLL=$(cygpath -m "$PWD/core-lib/skipicore.dll")" >> "$GITHUB_ENV"

          # The build copies the Core's GPL license from the sibling checkout, so it must exist.
          git clone --depth 1 --branch "$core_version" https://github.com/ZloyRadetski/skipi-core.git ../skipi-core

      - name: Build the portable application image
        shell: bash
        run: ./gradlew.bat --no-daemon :desktopApp:createDistributable "-PskipiCoreDesktopLibrary=$SKIPI_CORE_DLL"

      - name: Check the image and zip it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'desktopApp/build/compose/binaries/main/app/SKIPI'
          foreach ($required in 'SKIPI.exe', 'app/resources/skipicore.dll', 'app/resources/geoip.dat', 'app/resources/geosite.dat', 'app/resources/hev/hev-socks5-tunnel.exe', 'app/resources/hev/wintun.dll') {
            if (-not (Test-Path (Join-Path $image $required))) { throw "The portable image is missing $required" }
          }
          Compress-Archive -Path $image -DestinationPath SKIPI-windows-x64-portable.zip -CompressionLevel Optimal
          $hash = (Get-FileHash SKIPI-windows-x64-portable.zip -Algorithm SHA256).Hash.ToLower()
          "SKIPI-windows-x64-portable.zip sha256 $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKIPI_${{ env.VERSION_NAME }}-windows-x64-portable
          path: SKIPI-windows-x64-portable.zip
          if-no-files-found: error

      - name: Attach the archive to the GitHub Release
        if: env.CREATE_GITHUB_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" SKIPI-windows-x64-portable.zip --clobber

  desktop-linux:
    name: Build Linux Desktop (portable)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      CREATE_GITHUB_RELEASE: ${{ needs.release.outputs.create_github_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download the released SKIPI Core library
        shell: bash
        run: |
          set -euo pipefail

          core_version="$(sed -n 's/^[[:space:]]*const val SKIPI_CORE_VERSION = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$core_version" ]; then
            echo "::error::Unable to read ProjectConfig.SKIPI_CORE_VERSION from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          base="https://github.com/ZloyRadetski/skipi-core/releases/download/${core_version}"
          mkdir -p core-lib
          curl -fsSL --retry 3 -o core-lib/libskipicore.so "$base/libskipicore.so"
          curl -fsSL --retry 3 -o core-lib/sha256sums-desktop.txt "$base/sha256sums-desktop.txt"

          expected="$(grep -E '[[:space:]]\*?libskipicore\.so$' core-lib/sha256sums-desktop.txt | cut -d' ' -f1)"
          actual="$(sha256sum core-lib/libskipicore.so | cut -d' ' -f1)"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::libskipicore.so of $core_version does not match its published checksum (expected '$expected', got '$actual')."
            exit 1
          fi
          echo "SKIPI Core $core_version: checksum $actual"
          echo "SKIPI_CORE_LIB=$PWD/core-lib/libskipicore.so" >> "$GITHUB_ENV"

          # The build copies the Core's GPL license from the sibling checkout, so it must exist.
          git clone --depth 1 --branch "$core_version" https://github.com/ZloyRadetski/skipi-core.git ../skipi-core

      - name: Build the portable application image
        run: ./gradlew --no-daemon :desktopApp:createDistributable "-PskipiCoreDesktopLibrary=$SKIPI_CORE_LIB"

      - name: Check the image and pack it
        shell: bash
        run: |
          set -euo pipefail

          image="desktopApp/build/compose/binaries/main/app/SKIPI"
          test -d "$image" || { echo "::error::The application image $image was not produced."; exit 1; }
          for required in libskipicore.so libhev-socks5-tunnel.so geoip.dat geosite.dat; do
            if [ -z "$(find "$image" -name "$required" -type f -print -quit)" ]; then
              echo "::error::The portable image is missing $required."
              exit 1
            fi
          done
          test -x "$image/bin/SKIPI" || { echo "::error::The launcher $image/bin/SKIPI is not executable."; exit 1; }

          tar -C "$(dirname "$image")" -czf SKIPI-linux-x64-portable.tar.gz SKIPI
          sum="$(sha256sum SKIPI-linux-x64-portable.tar.gz | cut -d' ' -f1)"
          echo "SKIPI-linux-x64-portable.tar.gz sha256 $sum" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKIPI_${{ env.VERSION_NAME }}-linux-x64-portable
          path: SKIPI-linux-x64-portable.tar.gz
          if-no-files-found: error

      - name: Attach the archive to the GitHub Release
        if: env.CREATE_GITHUB_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" SKIPI-linux-x64-portable.tar.gz --clobber

  desktop-macos:
    name: Build macOS Desktop (Apple Silicon)
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
      CREATE_GITHUB_RELEASE: ${{ needs.release.outputs.create_github_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      # No macOS library is published with the Core releases, so the build compiles it from the
      # Core sources of the pinned version, which must sit next to this project.
      - name: Check out SKIPI Core of the pinned version
        shell: bash
        run: |
          set -euo pipefail

          core_version="$(sed -n 's/^[[:space:]]*const val SKIPI_CORE_VERSION = "\([^"]*\)".*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$core_version" ]; then
            echo "::error::Unable to read ProjectConfig.SKIPI_CORE_VERSION from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi
          echo "Building SKIPI Core $core_version from source"
          git clone --depth 1 --branch "$core_version" https://github.com/ZloyRadetski/skipi-core.git ../skipi-core

      - name: Build the disk image
        run: ./gradlew --no-daemon :desktopApp:packageDmg

      - name: Check the application and collect the disk image
        shell: bash
        run: |
          set -euo pipefail

          app="desktopApp/build/compose/binaries/main/app/SKIPI.app"
          test -d "$app" || { echo "::error::The application bundle $app was not produced."; exit 1; }
          for required in libskipicore.dylib geoip.dat geosite.dat hev-socks5-tunnel; do
            if [ -z "$(find "$app" -name "$required" -type f -print -quit)" ]; then
              echo "::error::The macOS application is missing $required."
              exit 1
            fi
          done
          hev="$(find "$app" -name hev-socks5-tunnel -type f -print -quit)"
          ls -l "$hev"
          if [ ! -x "$hev" ]; then
            echo "::warning::$hev has no executable bit in the bundle; the TUN supervisor restores it at run time."
          fi
          lipo -info "$(find "$app" -name libskipicore.dylib -type f -print -quit)"
          lipo -info "$hev"

          dmg="$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg" || { echo "::error::No .dmg was produced."; exit 1; }
          cp "$dmg" SKIPI-macos-arm64.dmg
          sum="$(shasum -a 256 SKIPI-macos-arm64.dmg | cut -d' ' -f1)"
          echo "SKIPI-macos-arm64.dmg sha256 $sum (not signed or notarized)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKIPI_${{ env.VERSION_NAME }}-macos-arm64
          path: SKIPI-macos-arm64.dmg
          if-no-files-found: error

      - name: Attach the disk image to the GitHub Release
        if: env.CREATE_GITHUB_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" SKIPI-macos-arm64.dmg --clobber
